<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Euro Stats PRO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #0a0e1a 0%, #1a1d2e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e8ecf4;
    }
    
    .login-container {
      background: rgba(18, 24, 41, 0.95);
      border: 1px solid #2a3550;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
    }
    
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .logo-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #f5c518, #c9a012);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #0a0e1a;
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    
    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #e8ecf4, #f5c518);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .subtitle {
      text-align: center;
      color: #8b95a8;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: #8b95a8;
    }
    
    input[type="password"] {
      width: 100%;
      padding: 0.85rem 1rem;
      background: #0a0e1a;
      border: 1px solid #2a3550;
      border-radius: 8px;
      color: #e8ecf4;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    
    input[type="password"]:focus {
      outline: none;
      border-color: #f5c518;
    }
    
    button {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #f5c518, #c9a012);
      border: none;
      border-radius: 8px;
      color: #0a0e1a;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    button:hover {
      transform: translateY(-2px);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    .error {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: none;
    }
    
    .error.show {
      display: block;
    }
    
    .shake {
      animation: shake 0.5s;
    }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
      20%, 40%, 60%, 80% { transform: translateX(5px); }
    }
    
    .pro-badge {
      display: inline-block;
      background: linear-gradient(135deg, #f5c518, #ff6b35);
      color: #000;
      font-size: 0.65rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-left: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <div class="logo-icon">€</div>
      <h1>Euro Stats <span class="pro-badge">PRO</span></h1>
      <p class="subtitle">Analyse Ultra-Avancée Euromillions</p>
    </div>
    
    <form id="login-form">
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input 
          type="password" 
          id="password" 
          placeholder="Entrez votre mot de passe"
          autocomplete="current-password"
          required
        >
        <div class="error" id="error">Mot de passe incorrect</div>
      </div>
      
      <button type="submit">Accéder au système</button>
    </form>
  </div>
  
  <script>
    const CORRECT_PASSWORD = 'Zoro19802004';
    const SESSION_KEY = 'euroStatsAuth';
    
    // Vérifier si déjà authentifié
    if (sessionStorage.getItem(SESSION_KEY) === 'true') {
      window.location.href = 'main.html';
    }
    
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      const inputEl = document.getElementById('password');
      
      if (password === CORRECT_PASSWORD) {
        // Authentification réussie
        sessionStorage.setItem(SESSION_KEY, 'true');
        window.location.href = 'main.html';
      } else {
        // Erreur
        errorEl.classList.add('show');
        inputEl.classList.add('shake');
        inputEl.value = '';
        
        setTimeout(() => {
          inputEl.classList.remove('shake');
        }, 500);
        
        setTimeout(() => {
          errorEl.classList.remove('show');
        }, 3000);
      }
    });
    
    // Focus automatique
    document.getElementById('password').focus();
  </script>
</body>
</html>
